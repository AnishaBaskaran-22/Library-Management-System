<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fine Management - LIBAPP</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7fb;
        margin: 0;
        padding: 0;
      }
      header {
        background-color: #2c3e50;
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 1.6rem;
        font-weight: 600;
      }
      main {
        padding: 40px;
        display: flex;
        justify-content: center;
      }
      table {
        width: 90%;
        max-width: 900px;
        border-collapse: collapse;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      }
      th,
      td {
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid #e0e0e0;
      }
      th {
        background-color: #3366ff;
        color: white;
        font-size: 1.1rem;
        text-transform: uppercase;
      }
      tr:hover {
        background-color: #f1f5ff;
      }
      .fine-amount {
        font-weight: 700;
        color: #d32f2f;
      }
      .no-fine {
        font-weight: 600;
        color: #388e3c;
      }
    </style>
  </head>
  <body>
    <header>Fine Management</header>
    <main>
      <table>
        <thead>
          <tr>
            <th>Book Title</th>
            <th>Return Date</th>
            <th>Days Overdue</th>
            <th>Fine Amount</th>
          </tr>
        </thead>
        <tbody id="fineTable">
          <tr>
            <td colspan="4">Loading fines...</td>
          </tr>
        </tbody>
      </table>
    </main>

    <script>
      async function loadFines() {
        try {
          const res = await fetch("/student_fines"); // backend API must return issued books with return_date
          const data = await res.json();
          const table = document.getElementById("fineTable");
          table.innerHTML = "";

          const today = new Date();

          if (data.books && data.books.length > 0) {
            data.books.forEach((book) => {
              const returnDate = new Date(book.return_date);
              let daysOverdue = Math.floor(
                (today - returnDate) / (1000 * 60 * 60 * 24)
              );

              let fine = 0;
              if (daysOverdue > 10) {
                fine = 50 + (daysOverdue - 10) * 10;
              }

              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td>${book.book_title}</td>
                <td>${book.return_date}</td>
                <td>${daysOverdue > 0 ? daysOverdue : 0}</td>
                <td class="${fine > 0 ? "fine-amount" : "no-fine"}">${
                fine > 0 ? "₹" + fine : "No Fine"
              }</td>
              `;
              table.appendChild(tr);
            });
          } else {
            table.innerHTML =
              "<tr><td colspan='4'>No borrowed books with pending fines.</td></tr>";
          }
        } catch (error) {
          console.error("Error fetching fines:", error);
          document.getElementById("fineTable").innerHTML =
            "<tr><td colspan='4'>Error loading fines.</td></tr>";
        }
      }

      window.onload = loadFines;
    </script>
  </body>
</html>
