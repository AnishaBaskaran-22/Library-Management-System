<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Library Feedback</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        padding: 0;
        margin: 0;
      }
      /* Top Navigation Bar */
      .navbar {
        background: #4682b4;
        color: white;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .navbar h1 {
        margin: 0;
        font-size: 20px;
        font-weight: bold;
      }
      .navbar a {
        background: white;
        color: #4682b4;
        padding: 8px 15px;
        text-decoration: none;
        border-radius: 4px;
        transition: background 0.3s ease;
      }
      .navbar a:hover {
        background: #45a049;
      }
      /* Page Content */
      .container {
        padding: 20px;
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }
      form {
        background: white;
        padding: 20px;
        max-width: 500px;
        margin: auto;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }
      label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
      }
      button {
        margin-top: 15px;
        padding: 10px 20px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #45a049;
      }
      .msg {
        margin-top: 15px;
        font-weight: bold;
        text-align: center;
      }
      .success {
        color: green;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <div class="navbar">
      <h1>BookHive</h1>
      <a href="/student_dashboard">Back to Dashboard</a>
    </div>

    <div class="container">
      <h2>Feedback Form</h2>
      <form action="/feedback" method="post">
        <label for="name">Name</label>
        <input type="text" name="name" required />

        <label for="email">Email</label>
        <input type="email" name="email" required />

        <label for="rating">Rating</label>
        <select name="rating" required>
          <option value="">--Select--</option>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Good</option>
          <option value="3">3 - Average</option>
          <option value="2">2 - Poor</option>
          <option value="1">1 - Very Poor</option>
        </select>

        <label for="comments">Comments</label>
        <textarea name="comments" rows="4" required></textarea>

        <button type="submit">Submit Feedback</button>
      </form>

      {% if success %}
      <p class="msg success">{{ success }}</p>
      {% endif %} {% if error %}
      <p class="msg error">{{ error }}</p>
      {% endif %}
    </div>
  </body>
</html>
