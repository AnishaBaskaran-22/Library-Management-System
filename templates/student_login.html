<!DOCTYPE html>
<html>
  <head>
    <title>Student Login - LIBAPP</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f4ff;
        text-align: center;
        padding-top: 80px;
      }
      form {
        display: inline-block;
        background-color: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      }
      input {
        display: block;
        margin: 10px auto;
        padding: 10px;
        width: 250px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }
      button {
        padding: 10px 20px;
        background-color: #1a73e8;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background-color: #1669c1;
      }
      .message {
        margin-top: 15px;
        font-size: 16px;
        font-weight: bold;
      }
      .success {
        color: green;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h2>User Login</h2>

    {% if error %}
    <div class="message error">{{ error }}</div>
    {% endif %}

    <form action="/student_login" method="post">
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
  </body>
</html>
