<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to BookHive</title>
    <style>
      /* Reset & base styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Georgia", serif;
        height: 100vh;
        background: url("https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=1920&q=80")
          no-repeat center center fixed;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        color: #1a1a1a;
      }

      /* White semi-transparent overlay for clarity */
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.65);
        z-index: 0;
      }

      .content {
        z-index: 1;
        text-align: center;
        padding: 40px 20px;
      }

      h1 {
        font-size: 100px;
        font-weight: 700;
        margin-bottom: 10px;
        color: #191c1e;
      }

      .subtitle {
        font-size: 50px;
        color: #333;
        margin-bottom: 40px;
      }

      .continue {
        font-size: 16px;
        color: #444;
        animation: blink 1.5s infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0.5;
        }
      }
    </style>
    <script>
      // Redirect to chooserole.html on any key press
      document.addEventListener("keydown", function () {
        window.location.href = "chooserole";
      });
    </script>
  </head>
  <body>
    <div class="overlay"></div>
    <div class="content">
      <h1>BookHive</h1>
      <div class="subtitle">Your Gateway to Knowledge</div>
      <div class="continue">Press any key to continue...</div>
    </div>
  </body>
</html>
