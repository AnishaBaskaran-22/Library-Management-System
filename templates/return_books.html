<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Return Books</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #e7eefc; /* Light steel blue background */
        padding: 30px;
      }
      .box {
        background-color: #fff;
        border-radius: 10px;
        padding: 20px;
        width: 750px;
        margin: auto;
        box-shadow: 0 0 10px rgba(70, 130, 180, 0.3); /* steel blue shadow */
        text-align: center;
        border: 2px solid #4682b4; /* SteelBlue border */
      }
      h2 {
        text-align: center;
        color: #4682b4; /* SteelBlue */
        margin-bottom: 25px;
      }
      .input-group {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        justify-content: center;
      }
      .input-group label {
        width: 200px;
        text-align: right;
        margin-right: 10px;
        color: #30597a; /* Darker steel blue for text */
        font-weight: 600;
      }
      .input-group input {
        padding: 10px;
        flex-grow: 1;
        max-width: 250px;
        margin-right: 10px;
        border: 1.5px solid #4682b4;
        border-radius: 4px;
        font-size: 1rem;
      }
      .input-group button {
        padding: 8px 16px;
        background-color: #4682b4; /* SteelBlue */
        border: none;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.3s ease;
      }
      .input-group button:hover {
        background-color: #35648f; /* Darker steel blue on hover */
      }
      #studentDetails {
        margin-bottom: 15px;
        font-weight: 600;
        color: #2c3e50;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      table,
      th,
      td {
        border: 1px solid #4682b4; /* SteelBlue border */
      }
      th,
      td {
        padding: 10px;
        text-align: center;
        color: #2c3e50;
      }
      th {
        background-color: #4682b4;
        color: white;
      }
      tr:hover {
        background-color: #d9e7fb; /* Light steel blue hover */
      }
      button.return-btn {
        padding: 6px 12px;
        background-color: #4682b4;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.3s ease;
      }
      button.return-btn:hover {
        background-color: #35648f;
      }
      #feedbackBox {
        margin-bottom: 18px;
        padding: 15px 25px;
        border-radius: 8px;
        background: #fff3cd;
        color: #856404;
        border: 1.5px solid #ffeeba;
        font-size: 1.07rem;
        font-weight: 500;
        display: none;
        max-width: 600px;
        margin: 20px auto;
      }
      #feedbackBox.success {
        background: #d4edda;
        color: #155724;
        border-color: #c3e6cb;
      }
      #feedbackBox.error {
        background: #f8d7da;
        color: #721c24;
        border-color: #f5c6cb;
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(70, 130, 180, 0.8); /* Steel blue with opacity */
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }
      .modal-content {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        width: 400px;
        border: 2px solid #4682b4;
        box-shadow: 0 0 15px rgba(70, 130, 180, 0.5);
      }
      .modal button {
        padding: 8px 16px;
        margin: 8px;
        cursor: pointer;
        font-weight: 600;
        border-radius: 5px;
        border: none;
        transition: background-color 0.3s ease;
      }
      .confirm-btn {
        background-color: #4caf50; /* green */
        color: white;
      }
      .confirm-btn:hover {
        background-color: #3a8d40;
      }
      .cancel-btn {
        background-color: #f44336;
        color: white;
      }
      .cancel-btn:hover {
        background-color: #ba2e28;
      }
      .check-fine-btn {
        background-color: #4682b4;
        color: white;
      }
      .check-fine-btn:hover {
        background-color: #35648f;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Return Borrowed Books</h2>

      <div class="input-group">
        <label for="memberId">Enter Member ID:</label>
        <input type="text" id="memberId" autocomplete="off" />
        <button onclick="fetchBorrowedBooks()">Go</button>
      </div>

      <div id="studentDetails"></div>

      <table id="borrowedBooksTable" style="display: none">
        <thead>
          <tr>
            <th>Book Title</th>
            <th>Issue Date</th>
            <th>Return Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="feedbackBox"></div>
    </div>

    <!-- Modal -->
    <div id="confirmationModal" class="modal">
      <div class="modal-content">
        <h2>Return Confirmation</h2>
        <p id="confirmationMessage"></p>
        <div id="fineInfo" style="margin: 15px 0; font-weight: 600"></div>
        <button id="checkFineBtn" class="check-fine-btn" onclick="checkFine()">
          Check Fine
        </button>
        <div id="paymentOptions" style="display: none">
          <button class="confirm-btn" onclick="completeReturn('paid')">
            Payment Done
          </button>
          <button class="cancel-btn" onclick="completeReturn('later')">
            Pay Later
          </button>
        </div>
        <button
          onclick="cancelReturn()"
          class="cancel-btn"
          style="margin-top: 10px"
        >
          Cancel
        </button>
      </div>
    </div>

    <script>
      let currentIssueId = null;
      let currentReturnDate = null;
      let fineAmount = 0;

      async function fetchBorrowedBooks() {
        const memberId = document.getElementById("memberId").value.trim();
        const studentDetails = document.getElementById("studentDetails");
        const table = document.getElementById("borrowedBooksTable");
        const tbody = table.querySelector("tbody");
        const feedbackBox = document.getElementById("feedbackBox");

        studentDetails.innerHTML = "";
        tbody.innerHTML = "";
        table.style.display = "none";
        feedbackBox.style.display = "none";

        if (!memberId) {
          alert("Please enter a valid Member ID");
          return;
        }

        try {
          const memberRes = await fetch(
            `http://localhost:8000/member/${memberId}`
          );
          if (!memberRes.ok) {
            studentDetails.innerHTML =
              '<div style="color: red;">Member not found!</div>';
            return;
          }
          const member = await memberRes.json();
          studentDetails.innerHTML = `<div><strong>Name:</strong> ${member.name}</div>
                                       <div><strong>Member ID:</strong> ${member.member_id}</div>`;

          const booksRes = await fetch(
            `http://localhost:8000/issued-books/${memberId}`
          );
          const issuedBooks = await booksRes.json();

          if (issuedBooks.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4">No books issued.</td></tr>';
          } else {
            issuedBooks.forEach((book) => {
              const row = document.createElement("tr");
              row.innerHTML = `
                <td>${book.book_title}</td>
                <td>${book.issue_date}</td>
                <td>${book.return_date}</td>
                <td><button class="return-btn" onclick="returnBook(${book.id}, '${book.book_title}', '${book.return_date}')">Return</button></td>
              `;
              tbody.appendChild(row);
            });
            table.style.display = "table";
          }
        } catch (err) {
          console.error(err);
          feedbackBox.textContent = "Something went wrong!";
          feedbackBox.className = "error";
          feedbackBox.style.display = "block";
        }
      }

      function returnBook(issueId, title, returnDate) {
        currentIssueId = issueId;
        currentReturnDate = returnDate;
        fineAmount = 0;
        document.getElementById(
          "confirmationMessage"
        ).textContent = `Do you want to return "${title}"?`;
        document.getElementById("fineInfo").textContent = "";
        document.getElementById("paymentOptions").style.display = "none";
        document.getElementById("checkFineBtn").style.display = "inline-block";
        document.getElementById("confirmationModal").style.display = "flex";
      }

      function checkFine() {
        const today = new Date();
        const returnDate = new Date(currentReturnDate);
        let daysOverdue = Math.floor(
          (today - returnDate) / (1000 * 60 * 60 * 24)
        );
        fineAmount = 0;
        if (daysOverdue > 10) {
          fineAmount = 50 + (daysOverdue - 10) * 10;
        }
        const fineInfo = document.getElementById("fineInfo");
        if (fineAmount > 0) {
          fineInfo.textContent = `Fine: ₹${fineAmount}`;
        } else {
          fineInfo.textContent = "No fine.";
        }
        // Show payment options only if there is a fine, else proceed to auto return with no payment needed
        const paymentOptions = document.getElementById("paymentOptions");
        if (fineAmount > 0) {
          paymentOptions.style.display = "block";
          // Show payment buttons, hide check fine button to encourage payment decision
          document.getElementById("checkFineBtn").style.display = "none";
        } else {
          paymentOptions.style.display = "none";
          // Hide check fine button as fine checked
          document.getElementById("checkFineBtn").style.display = "none";
          // Auto complete return with no payment needed after short delay
          setTimeout(() => {
            completeReturn("no-fine");
          }, 5000);
        }
      }

      function completeReturn(paymentStatus) {
        fetch(`http://localhost:8000/return-book/${currentIssueId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ payment: paymentStatus }),
        })
          .then((res) => res.json())
          .then((result) => {
            if (result.success) {
              showFeedback("Book returned successfully!", "success");
              fetchBorrowedBooks();
            } else {
              showFeedback("Return failed.", "error");
            }
          })
          .catch(() => showFeedback("Server error.", "error"));

        document.getElementById("confirmationModal").style.display = "none";
      }

      function cancelReturn() {
        document.getElementById("confirmationModal").style.display = "none";
      }

      function showFeedback(message, type) {
        const feedbackBox = document.getElementById("feedbackBox");
        feedbackBox.textContent = message;
        feedbackBox.className = type;
        feedbackBox.style.display = "block";
        setTimeout(() => (feedbackBox.style.display = "none"), 3000);
      }
    </script>
  </body>
</html>
